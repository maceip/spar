# Spar v1 run configuration.
# Scope and risk tiers are enforced in deterministic Python hooks (spar/guard.py),
# never in prompts. By default Spar attacks ONLY localhost and hosts explicitly
# allowlisted here, with state-changing actions disabled.

target:
  # Override via `spar run --target ...`; `spar demo` uses a localhost ephemeral port.
  base_url: "http://127.0.0.1:8765"
  contract:
    auth:
      header: "Authorization"
      prefix: "Bearer "
    chat:
      method: "POST"
      path: "/agent/chat"
      message_field: "message"
      image_field: "image_b64"
      session_field: "session_id"
      reply_field: "reply"
    invoke:
      method: "POST"
      path: "/agent/invoke"
      tool_field: "tool"
      args_field: "args"
    mcp:
      method: "POST"
      path: "/mcp/rpc"
    manifest:
      method: "GET"
      path: "/agent/manifest"
    version:
      method: "GET"
      path: "/version"
    reset:
      method: "POST"
      path: "/audit/reset"
    witnesses:
      tool_log:
        method: "GET"
        path: "/audit/tool-log"
        events_field: "events"
      positive_control:
        method: "POST"
        path: "/audit/ping"
        control_field: "control_id"
      outbox:
        method: "GET"
        path: "/users/{account}/outbox"
        items_field: "emails"
      refunds:
        method: "GET"
        path: "/refunds"
        items_field: "refunds"
      memory:
        method: "GET"
        path: "/memory"
        items_field: "passages"
      shared_docs:
        method: "POST"
        path: "/docs/shared"
      # Host-level egress telemetry, in kernel-obs shape: net/dns/watch/socket records
      # carrying addresses, ports, byte counts, question names and intervals -- metadata
      # only. Required only when defense.profile is not "none"; a target that does not
      # export it cannot be checked for covert egress.
      egress:
        method: "GET"
        path: "/audit/egress"
        events_field: "records"

# The host-observability defense Spar should test against. "none" (the default) plans no
# covert-egress objectives at all, because without an observer there is nothing to evade.
#
# "shirudo_style" describes a shirudo-hosted observer: signed and attested, so it cannot be
# unloaded; it aggregates per interval, records metadata rather than payload content, and
# keeps at most four question names per answered address. Spar recomputes every detector
# below from the raw records it fetched, so an observer whose own alerting is silent cannot
# make Spar report "defense held" when the traffic was never examined.
defense:
  profile: "none"
  # tamper_proof: true
  # tables: ["net", "dns", "watch", "socket"]
  # watch_list: []
  # dns_suffix: "telemetry.example"
  # dns_resolver: "127.0.0.1:53"
  # blind_spots: ["payload_not_recorded", "dns_names_truncated", "interval_deltas",
  #               "requested_lengths_only", "label_bytes_sanitized", "socket_attempts_only",
  #               "unix_and_kernel_creations", "timing_not_modelled"]
  # detectors:
  #   interval_s: 10.0
  #   content_inspection: false          # set true when a shield reads payloads (e.g. a Java agent)
  #   dns:
  #     max_label_bytes: 40
  #     max_qname_bytes: 120
  #     max_labels: 6
  #     min_label_bytes_for_entropy: 12
  #     max_entropy_bits_per_char: 3.4
  #     max_distinct_qnames: 24
  #   net:
  #     max_bytes_per_peer: 65536
  #     max_distinct_ports_per_peer: 8
  #     max_requests_per_peer: 30
  #     alert_new_peer: true
  #   watch:
  #     alert_on_hit: true

scope:
  allowlist_hosts:
    - "127.0.0.1"
    - "localhost"
  # Safe default: state-changing actions (resets, sending emails, issuing refunds,
  # writing shared memory) are DISABLED unless explicitly enabled via spar.yaml
  # or `--allow-risky`.
  allow_risky: false
  # Optional Ed25519 signature over scope allowlist for client engagements:
  # signature: ""
  # public_key_env: "SPAR_SCOPE_PUBKEY"

accounts:
  # Secrets by reference only: tokens are read from environment variables at
  # request time and are never persisted in artifacts or generated tests.
  - name: alice
    token_env: "SPAR_TOKEN_ALICE"
    role: user
  - name: bob
    token_env: "SPAR_TOKEN_BOB"
    role: user
  - name: auditor
    token_env: "SPAR_TOKEN_AUDITOR"
    role: auditor

budget:
  max_usd: 10.0
  max_requests: 5000
  max_duration_s: 1800
  rate_per_min: 600

trials:
  n: 20
  min_distinct_techniques: 3

llm:
  # Optional attacker/judge/fixer LLM endpoint (OpenAI-compatible).
  base_url: ""
  api_key_env: "OPENAI_API_KEY"
  model: ""
  usd_per_1k_input: 0.0
  usd_per_1k_output: 0.0

critic_llm:
  # Optional independent critic model (different model family from attacker/judge).
  base_url: ""
  api_key_env: "SPAR_CRITIC_API_KEY"
  model: ""
  usd_per_1k_input: 0.0
  usd_per_1k_output: 0.0
