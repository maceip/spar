[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spar-redteam"
version = "0.1.0"
description = "Spar: autonomous AI red-team & pentest system. Break the target, prove the compromise empirically, verify the fix."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ryan MacArthur" }]
keywords = ["red-team", "pentest", "ai-security", "llm-security", "agent-security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
yaml = ["PyYAML>=6"]
llm = ["openai>=1.0"]

[project.scripts]
spar = "spar.cli:main"

[tool.setuptools.packages.find]
include = ["spar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
