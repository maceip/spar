[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spar-redteam"
version = "0.1.0"
description = "Spar: autonomous AI red-team product. Aim with code, attack live agents, prove every finding, verify the fix."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "Ryan MacArthur" }]
keywords = ["red-team", "pentest", "ai-security", "llm-security", "agent-security"]
dependencies = [
    "PyYAML>=6",
    "Pillow>=10",
    "pyrit>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "cryptography>=42"]
eval = ["agentdojo", "openai>=1.0"]

[project.scripts]
spar = "spar.cli:main"

[tool.setuptools.packages.find]
include = ["spar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
